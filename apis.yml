aid: valctrl
name: ValCtrl
description: ValCtrl is a Y Combinator-backed (Spring 2026 batch) startup building an
  intelligent prediction market platform, where users can input any public, resolvable
  belief about the future and the platform structures, prices, and enables trading on
  that claim. Its world model maps typed beliefs to relevant market signals, evaluates
  basis risk, and provides model-priced liquidity. Founded by Gaurav Paliwal and Sarth
  Garg in New York City, the company is pre-launch with a stealth landing page and no
  public API, documentation, or developer surface as of July 2026.
